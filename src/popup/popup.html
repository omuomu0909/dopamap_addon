<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dopamap 設定</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #fafafa;
      color: #333;
    }

    .header {
      background: #d87950;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header img {
      width: 24px;
      height: 24px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    .field input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #d87950;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      font-size: 13px;
      color: #444;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-slider {
      background: #d87950;
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(18px);
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary {
      background: #d87950;
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      background: #c06840;
    }

    .btn-ghost {
      background: #eee;
      color: #555;
      width: 100%;
    }

    .btn-ghost:hover {
      background: #e0e0e0;
    }

    .status-msg {
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      color: #27ae60;
    }

    .status-msg.error {
      color: #e74c3c;
    }

    .divider {
      height: 1px;
      background: #eee;
    }

    /* テーマ切り替えボタン */
    .theme-selector {
      display: flex;
      gap: 8px;
    }

    .theme-btn {
      flex: 1;
      padding: 7px 10px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #555;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .theme-btn:hover {
      border-color: #bbb;
    }

    .theme-btn.active {
      border-color: #d87950;
      background: #fff4ef;
      color: #c06030;
    }

    /* 投稿者プリセット */
    .preset-add-row {
      display: flex;
      gap: 6px;
    }

    .preset-add-row input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .preset-add-row input:focus {
      border-color: #d87950;
    }

    .preset-add-btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      background: #d87950;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .preset-add-btn:hover {
      background: #c06840;
    }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
      max-height: 160px;
      overflow-y: auto;
    }

    .preset-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      border: 1px solid #eee;
      border-radius: 6px;
      background: #fafafa;
      font-size: 13px;
      color: #333;
    }

    .preset-item__name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preset-item__del {
      background: none;
      border: none;
      color: #bbb;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .preset-item__del:hover {
      color: #e74c3c;
    }

    .preset-empty {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      padding: 8px 0;
    }

    /* スライダー行 */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #d87950;
    }

    .slider-value {
      font-size: 12px;
      color: #555;
      min-width: 44px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon48.png" alt="dopamap" />
    <h1>dopamap</h1>
  </div>

  <div class="body">
    <!-- テーマ -->
    <div class="field">
      <label>パネルテーマ</label>
      <div class="theme-selector">
        <button class="theme-btn active" id="theme-dark" type="button">🌙 ダーク</button>
        <button class="theme-btn" id="theme-light" type="button">☀️ ライト</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- よく使う投稿者 -->
    <div class="field">
      <label>よく使う投稿者</label>
      <div class="preset-add-row">
        <input
          type="text"
          id="preset-input"
          placeholder="チャンネル名を入力"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="preset-add-btn" id="preset-add-btn" type="button">追加</button>
      </div>
      <div class="preset-list" id="preset-list">
        <p class="preset-empty">登録済みの投稿者はいません</p>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 有効/無効トグル -->
    <div class="toggle-row">
      <span class="toggle-label">拡張を有効にする</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-enabled" />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="divider"></div>

    <!-- 自動スキャン -->
    <div class="toggle-row">
      <span class="toggle-label">リスト表示時に自動スキャン</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-auto-scan" />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- 動画の最大表示件数 -->
    <div class="field">
      <label for="max-results">動画の最大表示件数</label>
      <div class="slider-row">
        <input type="range" id="max-results" min="1" max="20" step="1" />
        <span class="slider-value" id="max-results-value">10 件</span>
      </div>
    </div>

    <!-- スキャン間隔 -->
    <div class="field">
      <label for="scan-interval">スキャン間隔（リスト用）</label>
      <div class="slider-row">
        <input type="range" id="scan-interval" min="200" max="2000" step="100" />
        <span class="slider-value" id="scan-interval-value">600 ms</span>
      </div>
    </div>

    <!-- URL ポーリング間隔 -->
    <div class="field">
      <label for="poll-interval">検索し直し検知間隔</label>
      <div class="slider-row">
        <input type="range" id="poll-interval" min="10" max="3000" step="10" />
        <span class="slider-value" id="poll-interval-value">100 ms</span>
      </div>
      <div style="font-size:11px;color:#aaa;margin-top:4px;">
        ⚠ 50ms 以下は CPU 負荷が高くなります。10ms は最速ですが Maps が重くなる場合があります
      </div>
    </div>

    <!-- ショート動画デフォルトサイズ -->
    <div class="field">
      <label for="short-width">ショート動画のデフォルト幅</label>
      <div class="slider-row">
        <input type="range" id="short-width" min="200" max="800" step="10" />
        <span class="slider-value" id="short-width-value">420 px</span>
      </div>
    </div>

    <!-- 通常動画デフォルトサイズ -->
    <div class="field">
      <label for="landscape-width">通常動画のデフォルト幅</label>
      <div class="slider-row">
        <input type="range" id="landscape-width" min="400" max="1600" step="10" />
        <span class="slider-value" id="landscape-width-value">960 px</span>
      </div>
    </div>

    <div class="divider"></div>

    <button class="btn btn-primary" id="btn-save">保存</button>

    <div class="status-msg" id="status-msg"></div>

    <div class="divider"></div>

    <!-- キャッシュクリア -->
    <button class="btn btn-ghost" id="btn-clear-cache">キャッシュをクリア</button>
  </div>

  <script src="popup.ts" type="module"></script>
</body>
</html>
